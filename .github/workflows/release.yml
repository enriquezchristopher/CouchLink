name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Get FFmpeg
        shell: pwsh
        run: ./eng/get-ffmpeg.ps1

      - name: Test
        run: dotnet test -c Release

      - name: Package
        shell: pwsh
        run: ./eng/package.ps1 -OutDir artifacts

      # Two downloads per release: the portable zip and the installer.
      - name: Attach the zip and the installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" (Get-ChildItem artifacts/*.zip, artifacts/CouchLink-Setup-v*.exe).FullName --clobber

  virus-scan:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam

      - name: Scan release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/add-clamav-results.ps1 -Tag "${{ needs.release-please.outputs.tag_name }}"

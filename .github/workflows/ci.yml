name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for code
        id: code
        shell: pwsh
        run: |
          if (Test-Path CouchLink.slnx) {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::No solution on this ref yet; nothing to build."
          }

      - uses: actions/setup-dotnet@v6
        if: steps.code.outputs.present == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Get FFmpeg
        if: steps.code.outputs.present == 'true'
        shell: pwsh
        run: ./eng/get-ffmpeg.ps1

      - name: Restore
        if: steps.code.outputs.present == 'true'
        run: dotnet restore

      - name: Build (warnings are errors)
        if: steps.code.outputs.present == 'true'
        run: dotnet build -c Release --no-restore

      - name: Test
        if: steps.code.outputs.present == 'true'
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always() && steps.code.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Trial release package (zip and installer)
        if: steps.code.outputs.present == 'true'
        shell: pwsh
        run: ./eng/package.ps1 -OutDir artifacts

      # Installs, repairs and uninstalls the setup on this runner and checks the files and the four firewall rules.
      - name: Test the installer
        if: steps.code.outputs.present == 'true'
        shell: pwsh
        run: ./eng/test-installer.ps1 -Setup (Get-ChildItem artifacts/CouchLink-Setup-v*.exe).FullName

      - name: Upload package
        if: steps.code.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            artifacts/*.zip
            artifacts/CouchLink-Setup-v*.exe
          retention-days: 7
